<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel= "stylesheet" href="style.css">
</head>
<body>
    <div class = "calculator">
        <input type="text" placeholder="0" id="inputBox">
    <div>
        <button class="keys" id="clear">AC</button>
        <button class="keys" id="delete">DEL</button>
        <button class="operator" id="modulo">%</button>
        <button class="keys">RAD</button>
        <button class="keys">DEG</button>
        <button class="operator">/</button>
    </div>
    <div>
        <button class="keys">sin(</button>
        <button class="keys">cos(</button>
        <button class="keys">tan(</button>
        <button class="keys">ln</button>
        <button class="keys">Inv</button>
        <button class="keys">Exp</button>
    </div>
    <div>
        <button>9</button>
        <button>8</button>
        <button>7</button>
        <button class="keys">x!</button>
        <button class="keys">x<sup>y</sup></button>
        <button class="operator">*</button>
    </div>
    <div>
        <button>6</button>
        <button>5</button>
        <button>4</button>
        <button class="operator">(</button>
        <button class="operator">)</button>
        <button class="operator">-</button>     
    </div>
    <div>
        <button>3</button>
        <button>2</button>
        <button>1</button>
        <button class="keys">π</button>
        <button class="keys">√</button>
        <button class="operator">+</button>
    </div>
    <div>
        <button>00</button>
        <button>0</button>
        <button>.</button>
        <button class="keys">e</button>
        <button class="keys">nC<sup>r</sup></button>
        <button class="equalTo">=</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
